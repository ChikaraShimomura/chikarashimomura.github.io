<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>せどり帳 - 仕入れと売却の利益管理</title>
  <meta name="description" content="仕入れと売却を記録するだけで利益がひと目でわかる、シンプルな帳簿アプリ。グループ共有にも対応。" />
  <style>
    :root {
      --bg: #F4F6F8;
      --card: #FFFFFF;
      --text: #1C2733;
      --sub: #5A6B7C;
      --accent: #3D5166;
      --gold: #C9A961;
      --border: #E2E7EC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 48px 24px 64px; }
    .hero {
      background: var(--accent);
      color: #fff;
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 6px 24px rgba(28, 39, 51, 0.12);
    }
    .hero h1 { font-size: 28px; letter-spacing: 1px; }
    .hero .subtitle { margin-top: 8px; color: #C9D4E0; font-size: 14px; }
    .hero .gold { color: var(--gold); font-weight: bold; }
    .store-link {
      display: inline-block;
      margin-top: 24px;
      background: #fff;
      color: var(--accent);
      font-weight: bold;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 15px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px 28px;
      margin-top: 20px;
      box-shadow: 0 2px 10px rgba(28, 39, 51, 0.05);
    }
    .card h2 { font-size: 16px; color: var(--accent); margin-bottom: 10px; }
    .card ul { list-style: none; }
    .card li { padding: 4px 0; color: var(--sub); font-size: 14px; }
    .card li::before { content: "・"; color: var(--gold); font-weight: bold; }
    .links { margin-top: 28px; text-align: center; font-size: 13px; color: var(--sub); }
    .links a { color: var(--accent); }
    footer { margin-top: 40px; text-align: center; font-size: 12px; color: #93A1AF; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>せどり帳</h1>
      <p class="subtitle">仕入れと売却の<span class="gold">利益管理</span>をシンプルに</p>
      <a class="store-link" href="https://apps.apple.com/jp/app/id6793951342">App Store で入手</a>
    </div>

    <div class="card">
      <h2>できること</h2>
      <ul>
        <li>仕入れと売却を記録するだけで利益を自動計算</li>
        <li>月別・年別の売上げ一覧と利益グラフ</li>
        <li>招待コードでのグループ共有(メンバーごとの権限設定つき)</li>
        <li>メンバー別の集計・並び替え・絞り込み</li>
        <li>登録不要・共有を使わなければデータは端末内のみ</li>
      </ul>
    </div>

    <div class="links">
      <a href="https://note.com/vivid_slug9484/n/n6df2fa996c79">プライバシーポリシー・サポート</a>
    </div>

    <footer>© 2026 Chikara Shimomura</footer>
  </div>
</body>
</html>
